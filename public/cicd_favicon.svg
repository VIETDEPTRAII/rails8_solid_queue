<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="100" height="100" rx="22" fill="#0d1117"/>

  <!-- Track ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- CI arc — top half, sky blue -->
  <path d="M 16 50 A 34 34 0 0 1 84 50"
        fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>

  <!-- CD arc — bottom half, orange -->
  <path d="M 84 50 A 34 34 0 0 1 16 50"
        fill="none" stroke="#fb923c" stroke-width="7" stroke-linecap="round"/>

  <!-- Arrow tip top (CI end → clockwise) -->
  <polygon points="50,15 44,24 56,24" fill="#38bdf8"/>

  <!-- Arrow tip bottom (CD end → clockwise) -->
  <polygon points="50,85 56,76 44,76" fill="#fb923c"/>

  <!-- Center labels -->
  <text x="50" y="46"
        font-family="monospace" font-size="12" font-weight="700"
        fill="#38bdf8" text-anchor="middle">CI</text>
  <text x="50" y="60"
        font-family="monospace" font-size="12" font-weight="700"
        fill="#fb923c" text-anchor="middle">CD</text>
</svg>
